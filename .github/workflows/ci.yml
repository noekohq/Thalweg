name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy -diff
      - run: go vet ./...
      - run: go test -race ./...

  console-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: internal/console/webui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: internal/console/webui/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run build
      - name: Verify embedded assets are current
        working-directory: .
        run: git diff --exit-code -- internal/console/web
